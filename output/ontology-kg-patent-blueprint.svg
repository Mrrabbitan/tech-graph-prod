    <text x="200" y="555" text-anchor="middle" class="han  node-note">接入→处理→关联→分析→处置</text>
  </g>
  <!-- Node 7: 多因子风险评分 -->
  <g>
    <rect x="355" y="490" width="200" height="74" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1" rx="2"/>
    <circle cx="371" cy="506" r="11" fill="#00b4d8"/>
    <text x="371" y="510" text-anchor="middle" class="mono badge">7</text>
    <text x="465" y="522" text-anchor="middle" class="mono node-en">MULTI-FACTOR RISK</text>
    <text x="465" y="540" text-anchor="middle" class="han  node-zh">多因子风险评分</text>
    <text x="465" y="555" text-anchor="middle" class="han  node-note">区域 → 设备 → 事件 · 三级联动</text>
  </g>
  <!-- Node 9: 处置建议生成 -->
  <g>
