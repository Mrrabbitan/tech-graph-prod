    <rect x="300" y="370" width="310" height="74" fill="#0d2a4f" stroke="#00b4d8" stroke-width="1.6" rx="2"/>
    <rect x="304" y="374" width="302" height="66" fill="none" stroke="#00b4d8" stroke-width="0.5" stroke-dasharray="2,2"/>
