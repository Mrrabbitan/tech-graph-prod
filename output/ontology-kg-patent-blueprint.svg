    <circle cx="636" cy="506" r="11" fill="#00b4d8"/>
    <text x="636" y="510" text-anchor="middle" class="mono badge">9</text>
    <text x="730" y="522" text-anchor="middle" class="mono node-en">DISPOSITION ADVISOR</text>
