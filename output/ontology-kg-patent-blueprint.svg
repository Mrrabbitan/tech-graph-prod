<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820">
  <style>
    .mono { font-family: 'Courier New', 'Lucida Console', 'Noto Sans Mono CJK SC', monospace; }
    .han  { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif; }
    text  { fill: #caf0f8; }
    .title-main  { font-size: 18px; font-weight: 700; letter-spacing: 0.12em; fill: #caf0f8; }
    .title-sub   { font-size: 12px; letter-spacing: 0.06em; fill: #90e0ef; }
    .section     { font-size: 11px; letter-spacing: 0.14em; fill: #48cae4; text-transform: uppercase; }
    .node-en     { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #caf0f8; }
    .node-zh     { font-size: 12px; fill: #caf0f8; }
    .node-note   { font-size: 10px; fill: #48cae4; opacity: 0.85; }
    .edge-label  { font-size: 10px; fill: #48cae4; }
    .tb-label    { font-size: 9px; letter-spacing: 0.18em; fill: #48cae4; }
    .tb-value    { font-size: 11px; fill: #caf0f8; }
    .badge       { font-size: 11px; font-weight: 700; fill: #0a1628; }
  </style>

  <defs>
    <pattern id="grid-fine" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#0f1d3a" stroke-width="0.4"/>
    </pattern>
    <pattern id="grid-bold" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M 75 0 L 0 0 0 75" fill="none" stroke="#15315c" stroke-width="0.7"/>
    </pattern>

    <marker id="arr-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 4, 0 8" fill="#00b4d8"/>
    </marker>
    <marker id="arr-cyan-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="10 0, 0 4, 10 8" fill="#00b4d8"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 4, 0 8" fill="#f77f00"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="#0a1628"/>
  <rect width="1280" height="820" fill="url(#grid-fine)" opacity="0.9"/>
  <rect width="1280" height="820" fill="url(#grid-bold)" opacity="0.7"/>

  <rect x="20" y="20" width="1240" height="780" fill="none" stroke="#1c3f6e" stroke-width="0.8"/>
  <rect x="26" y="26" width="1228" height="768" fill="none" stroke="#0d2548" stroke-width="0.6"/>

  <g>
    <text x="40"   y="52"  class="mono section">PATENT ARCHITECTURE / BLUEPRINT v1.0</text>
    <text x="40"   y="78"  class="mono title-main">EDITABLE-ONTOLOGY KNOWLEDGE GRAPH + MULTI-FACTOR RISK ENGINE</text>
    <text x="40"   y="98"  class="han  title-sub">基于可编辑本体的运营知识图谱自动构建与多因子风险评估方法 — 系统架构框图</text>
    <line x1="40" y1="110" x2="1240" y2="110" stroke="#00b4d8" stroke-width="0.8"/>
  </g>

  <g>
    <text x="50" y="168" class="mono section">I. INGEST</text>
    <text x="50" y="276" class="mono section">II. CONFIG · STATS</text>
    <text x="50" y="384" class="mono section">III. GRAPH BUILD</text>
    <text x="50" y="512" class="mono section">IV. ANALYZE · ADVISE</text>
    <text x="50" y="640" class="mono section">V. SERVE · APPLY</text>

    <line x1="40" y1="175" x2="40" y2="225" stroke="#00b4d8" stroke-width="1"/>
    <line x1="40" y1="285" x2="40" y2="335" stroke="#00b4d8" stroke-width="1"/>
    <line x1="40" y1="395" x2="40" y2="445" stroke="#00b4d8" stroke-width="1"/>
    <line x1="40" y1="520" x2="40" y2="570" stroke="#00b4d8" stroke-width="1"/>
    <line x1="40" y1="650" x2="40" y2="700" stroke="#00b4d8" stroke-width="1"/>
  </g>

  <!-- Node 1: 本体配置接入 -->
  <g>
    <rect x="150" y="150" width="200" height="74" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1" rx="2"/>
    <circle cx="166" cy="166" r="11" fill="#00b4d8"/>
    <text x="166" y="170" text-anchor="middle" class="mono badge">1</text>
    <text x="260" y="182" text-anchor="middle" class="mono node-en">ONTOLOGY-CONFIG IN</text>
    <text x="260" y="200" text-anchor="middle" class="han  node-zh">本体配置接入</text>
    <text x="260" y="215" text-anchor="middle" class="han  node-note">用户上传 JSON · 实体/关系类型</text>
  </g>
  <!-- Node 2: SQLite 运营数据库对接 -->
  <g>
    <rect x="455" y="150" width="200" height="74" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1" rx="2"/>
    <circle cx="471" cy="166" r="11" fill="#00b4d8"/>
    <text x="471" y="170" text-anchor="middle" class="mono badge">2</text>
    <text x="565" y="182" text-anchor="middle" class="mono node-en">SQLITE DB CONNECTOR</text>
    <text x="565" y="200" text-anchor="middle" class="han  node-zh">SQLite 运营数据库对接</text>
    <text x="565" y="215" text-anchor="middle" class="han  node-note">拉取告警时序全量数据</text>
  </g>
  <!-- Node 3: API 接口模块 -->
  <g>
    <rect x="1010" y="150" width="200" height="420" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1" rx="2" stroke-dasharray="8,4"/>
    <circle cx="1026" cy="166" r="11" fill="#00b4d8"/>
    <text x="1026" y="170" text-anchor="middle" class="mono badge">3</text>
    <text x="1120" y="182" text-anchor="middle" class="mono node-en">API INTERFACE</text>
    <text x="1120" y="200" text-anchor="middle" class="han  node-zh">API 接口模块</text>
    <line x1="1025" y1="215" x2="1215" y2="215" stroke="#00b4d8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="1120" y="240" text-anchor="middle" class="han  node-note">外部系统调用入口</text>
    <text x="1120" y="260" text-anchor="middle" class="mono node-note">• GET /ontology/*</text>
    <text x="1120" y="278" text-anchor="middle" class="mono node-note">• GET /subgraph/:seed</text>
    <text x="1120" y="296" text-anchor="middle" class="mono node-note">• GET /graph/visualize</text>
    <line x1="1025" y1="320" x2="1215" y2="320" stroke="#00b4d8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="1120" y="345" text-anchor="middle" class="mono section">BIDIRECTIONAL</text>
    <text x="1120" y="372" text-anchor="middle" class="han  node-note">↔ ④ 本体配置管理</text>
    <text x="1120" y="398" text-anchor="middle" class="han  node-note">↔ ⑩ N 跳子图检索</text>
    <text x="1120" y="424" text-anchor="middle" class="han  node-note">↔ ⑪ 图谱可视化</text>
    <line x1="1025" y1="450" x2="1215" y2="450" stroke="#00b4d8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="1120" y="474" text-anchor="middle" class="mono section">PROTOCOL</text>
    <text x="1120" y="498" text-anchor="middle" class="mono node-note">HTTP / REST · JSON</text>
    <text x="1120" y="520" text-anchor="middle" class="han  node-note">关键词 + 跳数限制</text>
    <text x="1120" y="546" text-anchor="middle" class="mono node-note">N-HOP PARAMS</text>
  </g>

  <!-- Node 4: 本体配置管理 -->
  <g>
    <rect x="150" y="260" width="200" height="74" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1" rx="2"/>
    <circle cx="166" cy="276" r="11" fill="#00b4d8"/>
    <text x="166" y="280" text-anchor="middle" class="mono badge">4</text>
    <text x="260" y="292" text-anchor="middle" class="mono node-en">ONTOLOGY-CONFIG MGR</text>
